<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card do Herói</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================
       RESET CSS
    ========================== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ==========================
       VARIÁVEIS
    ========================== */
    :root {
      --cor-primaria: #2563eb;
      --cor-secundaria: #1e293b;
      --cor-fundo: #f1f5f9;
      --cor-card: #ffffff;
      --cor-texto: #334155;
      --radius: 16px;
      --sombra: 0 10px 25px rgba(0, 0, 0, 0.08);
      --transicao: all 0.3s ease;
    }

    /* ==========================
       ESTILO GLOBAL
    ========================== */
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--cor-fundo);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* ==========================
       CARD
    ========================== */
    .card-heroi {
      background: var(--cor-card);
      width: 320px;
      padding: 30px 25px;
      border-radius: var(--radius);
      box-shadow: var(--sombra);
      text-align: center;
      transition: var(--transicao);
    }

    .card-heroi:hover {
      transform: scale(1.05);
    }

    /* ==========================
       IMAGEM
    ========================== */
    .card-heroi img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid var(--cor-primaria);
    }

    /* ==========================
       TÍTULO
    ========================== */
    .card-heroi h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--cor-secundaria);
      margin-bottom: 15px;
    }

    /* ==========================
       PARÁGRAFO
    ========================== */
    .card-heroi p {
      font-size: 14px;
      color: var(--cor-texto);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* ==========================
       BOTÃO
    ========================== */
    .card-heroi button {
      background-color: var(--cor-primaria);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transicao);
    }

    .card-heroi button:hover {
      background-color: #1d4ed8;
      transform: scale(1.05);
    }

  </style>
</head>
<body>

  <div class="card-heroi">
    <img src="https://i.pravatar.cc/300" alt="Imagem do Herói">
    <h2>Capitão Código</h2>
    <p>
      Especialista em resolver bugs críticos e proteger sistemas contra ameaças digitais.
      Sempre pronto para uma nova missão!
    </p>
    <button>Solicitar Missão</button>
  </div>

</body>
</html>
